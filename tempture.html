```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #333;
            margin: 15px 0 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4c5ed5;
        }

        .results {
            margin-top: 25px;
            display: none;
        }

        .results h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 21px;
        }

        .result-box {
            background: #f2f4ff;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #333;
            font-size: 17px;
            font-weight: bold;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: #ffe5e5;
            color: #c62828;
        }

        .success {
            display: block;
            background: #e3f8e8;
            color: #237a39;
        }

        .footer {
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌡️ Temperature Converter</h1>

        <p class="subtitle">
            Convert Celsius, Fahrenheit and Kelvin easily.
        </p>

        <form id="converterForm">

            <label for="temperature">Enter Temperature</label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature value"
                step="any"
                required
            >

            <label for="unit">Select Input Unit</label>

            <select id="unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit">Convert Temperature</button>

        </form>

        <div id="message" class="message" role="alert" aria-live="polite"></div>

        <div class="results" id="results" aria-live="polite">

            <h2>Conversion Results</h2>

            <div class="result-box" id="celsiusResult"></div>

            <div class="result-box" id="fahrenheitResult"></div>

            <div class="result-box" id="kelvinResult"></div>

        </div>

        <p class="footer">Simple • Fast • Accurate</p>

    </div>

    <script>
        const form = document.getElementById("converterForm");
        const temperatureInput = document.getElementById("temperature");
        const unitSelect = document.getElementById("unit");
        const message = document.getElementById("message");
        const results = document.getElementById("results");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const rawValue = temperatureInput.value.trim();
            const temperature = Number(rawValue);
            const unit = unitSelect.value;

            // Hide previous results and messages
            message.className = "message";
            message.textContent = "";
            results.style.display = "none";

            // Validate empty and non-numeric input
            if (rawValue === "" || !Number.isFinite(temperature)) {
                showError("Please enter a valid numeric temperature.");
                return;
            }

            let celsius;

            // Convert input to Celsius first
            if (unit === "C") {
                celsius = temperature;
            } else if (unit === "F") {
                celsius = (temperature - 32) * 5 / 9;
            } else {
                celsius = temperature - 273.15;
            }

            // Check absolute zero
            if (celsius < -273.15) {
                showError(
                    "Temperature cannot be below absolute zero (-273.15 °C). Please enter a valid temperature."
                );
                return;
            }

            // Convert Celsius to all output units
            const fahrenheit = (celsius * 9 / 5) + 32;
            const kelvin = celsius + 273.15;

            // Display all results
            document.getElementById("celsiusResult").textContent =
                "Celsius: " + celsius.toFixed(2) + " °C";

            document.getElementById("fahrenheitResult").textContent =
                "Fahrenheit: " + fahrenheit.toFixed(2) + " °F";

            document.getElementById("kelvinResult").textContent =
                "Kelvin: " + kelvin.toFixed(2) + " K";

            results.style.display = "block";

            message.textContent = "Temperature converted successfully!";
            message.className = "message success";
        });

        function showError(text) {
            message.textContent = text;
            message.className = "message error";
        }
    </script>

</body>
</html>
