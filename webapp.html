<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Task Manager</title>

    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 36px;
            color: #2563eb;
            margin-bottom: 10px;
        }

        header p {
            color: #64748b;
        }

        /* Add Task Form */
        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .task-form input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .task-form input:focus {
            border-color: #2563eb;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 14px 20px;
            font-size: 15px;
        }

        /* Task Lists Layout */
        .task-lists {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .task-section {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            min-width: 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .section-header h2 {
            font-size: 20px;
        }

        .counter {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            font-weight: bold;
        }

        .completed-counter {
            background: #dcfce7;
            color: #15803d;
        }

        /* Individual Task */
        .task-item {
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 9px;
            margin-bottom: 12px;
            background: #ffffff;
            overflow-wrap: anywhere;
        }

        .task-item:last-child {
            margin-bottom: 0;
        }

        .task-text {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .completed-task .task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-time {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        /* Task Action Buttons */
        .task-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .complete-btn {
            background: #dcfce7;
            color: #15803d;
        }

        .edit-btn {
            background: #fef3c7;
            color: #92400e;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        /* Inline Editing */
        .edit-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 10px;
            outline: none;
        }

        /* Empty State */
        .empty-message {
            text-align: center;
            color: #94a3b8;
            padding: 30px 10px;
            font-size: 14px;
            line-height: 1.7;
        }

        .empty-icon {
            font-size: 35px;
            display: block;
            margin-bottom: 8px;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 30px;
        }

        /* Responsive Design */
        @media (max-width: 650px) {
            body {
                padding: 20px 12px;
            }

            header h1 {
                font-size: 29px;
            }

            .task-form {
                padding: 12px;
            }

            .task-form input {
                padding: 12px;
                font-size: 14px;
            }

            .add-btn {
                padding: 12px;
                font-size: 14px;
            }

            .task-lists {
                grid-template-columns: 1fr;
            }

            .task-section {
                padding: 17px;
            }
        }

        @media (max-width: 380px) {
            .task-form {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .section-header h2 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>📝 My Task Manager</h1>
            <p>Organize your day, one task at a time!</p>
        </header>

        <!-- Add Task Form -->
        <form class="task-form" id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                maxlength="300"
                autocomplete="off"
                aria-label="New task"
                required
            >

            <button type="submit" class="add-btn">
                + Add Task
            </button>
        </form>

        <!-- Pending and Completed Lists -->
        <div class="task-lists">

            <!-- Pending Tasks -->
            <section class="task-section">

                <div class="section-header">
                    <h2>📋 Pending Tasks</h2>
                    <span class="counter" id="pendingCount">
                        0 pending
                    </span>
                </div>

                <div id="pendingList" aria-live="polite"></div>

            </section>

            <!-- Completed Tasks -->
            <section class="task-section">

                <div class="section-header">
                    <h2>✅ Completed Tasks</h2>
                    <span class="counter completed-counter" id="completedCount">
                        0 completed
                    </span>
                </div>

                <div id="completedList" aria-live="polite"></div>

            </section>

        </div>

        <footer>
            <p>My Task Manager | Stay Organized 🚀</p>
        </footer>

    </div>

    <script>
        // =====================================
        // 1. GET HTML ELEMENTS
        // =====================================

        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const pendingList = document.getElementById("pendingList");
        const completedList = document.getElementById("completedList");
        const pendingCount = document.getElementById("pendingCount");
        const completedCount = document.getElementById("completedCount");

        // Load saved tasks from localStorage
        let tasks = [];

        try {
            const savedTasks = localStorage.getItem("myTaskManagerTasks");
            const parsedTasks = savedTasks ? JSON.parse(savedTasks) : [];

            if (Array.isArray(parsedTasks)) {
                tasks = parsedTasks.filter(task =>
                    task &&
                    typeof task.id === "string" &&
                    typeof task.text === "string" &&
                    typeof task.completed === "boolean"
                );
            }
        } catch (error) {
            tasks = [];
        }

        // Currently edited task ID
        let editingTaskId = null;


        // =====================================
        // 2. SAVE TASKS
        // =====================================

        function saveTasks() {
            try {
                localStorage.setItem(
                    "myTaskManagerTasks",
                    JSON.stringify(tasks)
                );
            } catch (error) {
                alert("Tasks could not be saved in this browser.");
            }
        }


        // =====================================
        // 3. FORMAT DATE AND TIME
        // =====================================

        function formatDate(dateString) {
            if (!dateString) {
                return "";
            }

            const date = new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            return date.toLocaleString();
        }


        // =====================================
        // 4. ADD NEW TASK
        // =====================================

        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (text === "") {
                alert("Please enter a task!");
                return;
            }

            const task = {
                id: Date.now().toString() + "-" +
                    Math.random().toString(36).slice(2),
                text: text,
                completed: false,
                createdAt: new Date().toISOString(),
                completedAt: null
            };

            tasks.unshift(task);

            saveTasks();

            editingTaskId = null;

            renderTasks();

            taskInput.value = "";
            taskInput.focus();
        });


        // =====================================
        // 5. DISPLAY TASKS AND COUNTERS
        // =====================================

        function renderTasks() {
            pendingList.replaceChildren();
            completedList.replaceChildren();

            const pendingTasks = tasks.filter(task => !task.completed);
            const completedTasks = tasks.filter(task => task.completed);

            // Update counters
            pendingCount.textContent =
                pendingTasks.length + " pending";

            completedCount.textContent =
                completedTasks.length + " completed";

            // Pending empty message
            if (pendingTasks.length === 0) {
                pendingList.appendChild(
                    createEmptyMessage(
                        "🎉",
                        "No pending tasks!",
                        "You're all caught up."
                    )
                );
            }

            // Completed empty message
            if (completedTasks.length === 0) {
                completedList.appendChild(
                    createEmptyMessage(
                        "🌱",
                        "No completed tasks yet.",
                        "Finish a task to see it here."
                    )
                );
            }

            // Render pending tasks
            pendingTasks.forEach(task => {
                pendingList.appendChild(createTaskElement(task));
            });

            // Render completed tasks
            completedTasks.forEach(task => {
                completedList.appendChild(createTaskElement(task));
            });
        }


        // =====================================
        // 6. EMPTY STATE MESSAGE
        // =====================================

        function createEmptyMessage(icon, title, description) {
            const box = document.createElement("div");
            box.className = "empty-message";

            const iconElement = document.createElement("span");
            iconElement.className = "empty-icon";
            iconElement.textContent = icon;

            const titleElement = document.createElement("strong");
            titleElement.textContent = title;

            const descriptionElement = document.createElement("p");
            descriptionElement.textContent = description;

            box.append(iconElement, titleElement, descriptionElement);

            return box;
        }


        // =====================================
        // 7. CREATE A TASK CARD
        // =====================================

        function createTaskElement(task) {
            const card = document.createElement("div");

            card.className = "task-item";

            if (task.completed) {
                card.classList.add("completed-task");
            }

            // Task text
            if (editingTaskId === task.id) {
                const editInput = document.createElement("input");

                editInput.type = "text";
                editInput.className = "edit-input";
                editInput.maxLength = 300;
                editInput.value = task.text;
                editInput.setAttribute("aria-label", "Edit task");

                card.appendChild(editInput);

                const editActions = document.createElement("div");
                editActions.className = "task-actions";

                const saveButton = createButton("Save", "save-btn");
                const cancelButton = createButton("Cancel", "cancel-btn");

                saveButton.addEventListener("click", function() {
                    saveEditedTask(task.id, editInput.value);
                });

                cancelButton.addEventListener("click", function() {
                    editingTaskId = null;
                    renderTasks();
                });

                editInput.addEventListener("keydown", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        saveEditedTask(task.id, editInput.value);
                    }

                    if (event.key === "Escape") {
                        editingTaskId = null;
                        renderTasks();
                    }
                });

                editActions.append(saveButton, cancelButton);
                card.appendChild(editActions);

                setTimeout(() => {
                    editInput.focus();
                    editInput.select();
                }, 0);

            } else {
                const text = document.createElement("div");
                text.className = "task-text";
                text.textContent = task.text;

                card.appendChild(text);
            }

            // Created timestamp
            const createdTime = document.createElement("div");
            createdTime.className = "task-time";
            createdTime.textContent =
                "Added: " + formatDate(task.createdAt);

            card.appendChild(createdTime);

            // Completed timestamp
            if (task.completed && task.completedAt) {
                const completedTime = document.createElement("div");
                completedTime.className = "task-time";
                completedTime.textContent =
                    "Completed: " + formatDate(task.completedAt);

                card.appendChild(completedTime);
            }

            // Do not display regular actions while editing
            if (editingTaskId !== task.id) {
                const actions = document.createElement("div");
                actions.className = "task-actions";

                // Mark Complete / Undo
                const completeButton = createButton(
                    task.completed ? "↩ Undo" : "✓ Mark Complete",
                    "complete-btn"
                );

                completeButton.addEventListener("click", function() {
                    toggleComplete(task.id);
                });

                // Edit
                const editButton = createButton("✎ Edit", "edit-btn");

                editButton.addEventListener("click", function() {
                    editingTaskId = task.id;
                    renderTasks();
                });

                // Delete
                const deleteButton = createButton("🗑 Delete", "delete-btn");

                deleteButton.addEventListener("click", function() {
                    deleteTask(task.id);
                });

                actions.append(
                    completeButton,
                    editButton,
                    deleteButton
                );

                card.appendChild(actions);
            }

            return card;
        }


        // =====================================
        // 8. CREATE BUTTON HELPER
        // =====================================

        function createButton(text, className) {
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = text;
            button.className = className;

            return button;
        }


        // =====================================
        // 9. SAVE EDITED TASK
        // =====================================

        function saveEditedTask(id, newText) {
            const text = newText.trim();

            if (text === "") {
                alert("Task cannot be empty!");
                return;
            }

            const task = tasks.find(task => task.id === id);

            if (!task) {
                return;
            }

            task.text = text;

            editingTaskId = null;

            saveTasks();
            renderTasks();
        }


        // =====================================
        // 10. MARK COMPLETE OR UNDO
        // =====================================

        function toggleComplete(id) {
            const task = tasks.find(task => task.id === id);

            if (!task) {
                return;
            }

            task.completed = !task.completed;

            if (task.completed) {
                task.completedAt = new Date().toISOString();
            } else {
                task.completedAt = null;
            }

            editingTaskId = null;

            saveTasks();
            renderTasks();
        }


        // =====================================
        // 11. DELETE TASK
        // =====================================

        function deleteTask(id) {
            const confirmed = confirm(
                "Are you sure you want to delete this task?"
            );

            if (!confirmed) {
                return;
            }

            tasks = tasks.filter(task => task.id !== id);

            if (editingTaskId === id) {
                editingTaskId = null;
            }

            saveTasks();
            renderTasks();
        }


        // =====================================
        // 12. INITIAL DISPLAY
        // =====================================

        renderTasks();

    </script>

</body>
</html>
